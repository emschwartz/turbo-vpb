[package]
name = "turbovpb-server"
authors = ["Evan Schwartz <evan@turbovpb.com>"]
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.6.20", default-features = false, features = [
    "http1",
    "json",
    "ws",
] }
dashmap = { version = "5.5", features = ["inline"] }
futures = "0.3"
once_cell = "1.14"
prometheus = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tinytemplate = "1.2"
tokio-rusqlite = { version = "0.6", features = ["bundled"] }
tokio = { version = "1.20", default-features = false, features = [
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower-http = { version = "0.4", features = ["compression-full", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
