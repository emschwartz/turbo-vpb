# fly.toml file generated for turbovpb-server on 2022-08-30T08:25:25+02:00

app = "turbovpb-server"
kill_signal = "SIGINT"
kill_timeout = 20
processes = []

[env]
RUST_LOG = "turbovpb_server=info"
RUST_BACKTRACE = "1"

[experimental]
allowed_public_ports = []
auto_rollback = true

[metrics]
port = 8081
path = "/metrics"

[http_service]
internal_port = 8080
force_https = true

[http_service.concurrency]
type = "connections"
hard_limit = 100000

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/status"
