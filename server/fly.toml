app = "turbovpb-server"

[env]
RUST_LOG = "turbovpb_server=info"
RUST_BACKTRACE = "1"
DATABASE_PATH = "/data/turbovpb.db"

[mounts]
source = "turbovpb_data"
destination = "/data"

[metrics]
port = 8081
path = "/metrics"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true

[http_service.concurrency]
type = "connections"
hard_limit = 100000

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[[http_service.checks]]
grace_period = "5s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/status"
