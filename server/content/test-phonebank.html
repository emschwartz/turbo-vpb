<div>
  <div id="openvpbsidebarcontainer"></div>
  <div class="van-header"></div>

  <h1>Contact</h1>
  <a id="openVpbPhoneLink" href="tel:+11234567890">(123)-456-7890</a>

  <div class="person-phone-panel">
    <div id="contactName"></div>
  </div>

  <div id="openvpb-target-details">
    <dl>
      <dt>Address</dt>
      <dl id="address"></dl>
    </dl>
  </div>

  <button id="displaycontactresultsbutton">Couldn't Reach Contact</button>
  <button id="firstcallmodalnextcallbutton">First Call Button</button>

  <div>
    <ul class="contact-results">
      <li class="radio-unit">
        <input id="left-voicemail" value="Left Voicemail" type="radio" name="script-contact-result" />
        <label for="left-voicemail" class="radio-label">Left Voicemail</label>
      </li>

      <li class="radio-unit">
        <input id="refused" value="Refused" type="radio" name="script-contact-result" />
        <label for="refused" class="radio-label">Refused</label>
      </li>

      <li class="radio-unit">
        <input id="busy" value="Busy" type="radio" name="script-contact-result" />
        <label for="busy" class="radio-label">Busy</label>
      </li>

      <li class="radio-unit">
        <input id="texted" value="Texted" type="radio" name="script-contact-result" />
        <label for="texted" class="radio-label">Texted</label>
      </li>
    </ul>

    <button id="contactresultscancelbutton">Cancel</button>
    <button id="contactresultssavenextbutton" onclick="saveAndNext()">
      Save Results & Load Next
    </button>
  </div>
</div>

<script>
  const TEST_CONTACTS = [
    { name: { first: "Alice", last: "Johnson" }, phone: "(555)-123-4567", address: "123 Main St, Springfield, Illinois" },
    { name: { first: "Bob", last: "Smith" }, phone: "(555)-987-6543", address: "456 Oak Ave, Portland, Oregon" },
    { name: { first: "Carol", last: "Williams" }, phone: "(555)-246-8135", address: "789 Pine Rd, Austin, Texas" },
  ];
  // Test options:
  // ?household: the second contact shares the first one's phone number
  //   (e.g. two people in the same household), as is common in VAN
  // ?navigate: "Save Results & Load Next" loads the next contact with a full
  //   page load, like VAN does, instead of updating the page in place
  const params = new URLSearchParams(window.location.search);
  if (params.has("household")) {
    TEST_CONTACTS[1].phone = TEST_CONTACTS[0].phone;
  }
  let contactIndex = Number(params.get("contact")) || 0;

  function saveAndNext() {
    if (params.has("navigate")) {
      params.set("contact", String(contactIndex));
      window.location.search = params.toString();
    } else {
      nextContact();
    }
  }

  function nextContact() {
    const contact = TEST_CONTACTS[contactIndex % TEST_CONTACTS.length];
    contactIndex++;
    document.getElementById("contactName").innerText = `${contact.name.first} ${contact.name.last}`;
    document.getElementById("address").innerText = contact.address;
    const phoneNumber = document.getElementById("openVpbPhoneLink");
    phoneNumber.href = `tel:${contact.phone}`;
    phoneNumber.innerText = contact.phone;
  }
  nextContact();
</script>
